@if (auth.user(); as user) {
  <header class="navbar" [attr.data-rol]="user.rol">
    <div class="navbar-izquierda">
      <a [routerLink]="auth.homeRoute()" class="marca">EduMentor Hub</a>

      <nav aria-label="Opciones del rol">
        <ul>
          @for (item of permissions(); track item) {
            <li>
              <a [routerLink]="auth.homeRoute()" routerLinkActive="activo">{{ item }}</a>
            </li>
          }
        </ul>
      </nav>
    </div>

    <div class="navbar-derecha">
      <div class="icono-rol" [attr.title]="user.rol" aria-hidden="true">
        @switch (user.rol) {
          @case ('ESTUDIANTE') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
          }
          @case ('TUTOR') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
          }
          @case ('COORDINADOR') {
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
          }
        }
      </div>

      <div class="usuario-info">
        <span class="usuario-nombre">{{ user.nombre }} {{ user.apellido }}</span>
        <span class="usuario-id">{{ user.carne }} · {{ user.rol }}</span>
      </div>

      <button
        type="button"
        class="boton-logout"
        (click)="logout()"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </header>
}
