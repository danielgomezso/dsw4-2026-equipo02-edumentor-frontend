<section class="auth-page auth-page--login" aria-labelledby="titulo-login">
  <h1 id="titulo-login">{{ i18n.t('login') }}</h1>
  <p class="subtitulo">{{ i18n.t('institutionalLogin') }}</p>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="campo">
      <label for="email">{{ i18n.t('emailLabel') }}</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="isInvalid('email')"
        [attr.aria-describedby]="isInvalid('email') ? 'email-error' : null"
      />
      @if (isInvalid('email')) {
        <span class="error" id="email-error">{{ i18n.t('emailInvalid') }}</span>
      }
    </div>
    <div class="campo">
      <label for="password">{{ i18n.t('passwordLabel') }}</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="isInvalid('password')"
        [attr.aria-describedby]="isInvalid('password') ? 'password-error' : null"
      />
      @if (isInvalid('password')) {
        <span class="error" id="password-error">{{ i18n.t('passwordRequired') }}</span>
      }
    </div>
    @if (serverError(); as message) {
      <p class="error-servidor" role="alert">{{ message }}</p>
    }
    <button type="submit" class="boton-primario" [disabled]="submitting()">
      {{ i18n.t(submitting() ? 'signingIn' : 'login') }}
    </button>
  </form>
  <p class="pie">
    {{ i18n.t('noAccount') }} <a routerLink="/registro">{{ i18n.t('register') }}</a>
  </p>
</section>
